name: 跟随 keiyoushi 同步更新

on:
  schedule:
    # 每天 UTC 03:23（北京时间 11:23）跑一次
    - cron: '23 3 * * *'
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 同步扩展（拉上游索引、补新版本 APK 与图标）
        run: python sync.py

      - name: 提交变化
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "上游没有变化，本次不提交"
          else
            git commit -m "同步 keiyoushi 更新 $(date -u +%Y-%m-%d)"
            git push
            echo "HOOK_CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: 清除 jsDelivr 缓存
        if: env.HOOK_CHANGED == '1'
        run: python sync.py --purge-only
